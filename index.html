<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/brand/logo_2d.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ARGON Studios — Spatial Print &amp; Augmented Experiences</title>
    
    <!-- Google Fonts for Argon Premier Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Global Error Trap -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL ERROR:', e);
        if (e.message && (e.message.indexOf('ResizeObserver') !== -1 || e.message.indexOf('Script error') !== -1)) return;
        var box = document.getElementById('error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'error-box';
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:14px 20px;background:#991B1B;color:#FEE2E2;z-index:999999;font-family:monospace;font-size:12px;white-space:pre-wrap;border-bottom:2px solid #EF4444;display:flex;justify-content:space-between;align-items:flex-start;';
          var textSpan = document.createElement('span');
          textSpan.id = 'error-box-text';
          var closeBtn = document.createElement('button');
          closeBtn.innerText = '✕';
          closeBtn.style.cssText = 'background:none;border:none;color:#FFF;font-size:16px;font-weight:bold;cursor:pointer;padding:0 0 0 12px;';
          closeBtn.onclick = function() { box.remove(); };
          box.appendChild(textSpan);
          box.appendChild(closeBtn);
          document.body.appendChild(box);
        }
        var textElem = document.getElementById('error-box-text');
        if (textElem) {
          textElem.innerText = 'Notice: ' + (e.error ? (e.error.stack || e.error.message) : e.message);
        }
      });
    </script>
  </head>
  <body style="background-color: #0A0A0C; color: #E5E2E3; margin: 0; min-height: 100vh;" class="bg-[#0A0A0C] text-[#E5E2E3] antialiased selection:bg-[#D4AF37] selection:text-black">
    <div id="root">
      <!-- Luxury Preloader shown while assets stream -->
      <div id="argon-preloader" style="position: fixed; inset: 0; background: #0A0A0C; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Manrope', system-ui, sans-serif;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 24px;">
          <img src="/brand/logo_2d.jpg" alt="Argon Studios" style="width: 100%; height: 100%; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.4); box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);" />
        </div>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 600; color: #D4AF37; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px;">
          ARGON STUDIOS
        </div>
        <div style="font-size: 11px; color: #9E9EA4; letter-spacing: 0.25em; text-transform: uppercase;">
          Loading Experience...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
